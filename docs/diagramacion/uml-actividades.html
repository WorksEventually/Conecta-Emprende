<script type="text/plain" id="src-ciclo">

<script type="text/plain" id="src-estados">
stateDiagram-v2
    direction TB

    [*] --> OPEN : REQUEST_CREATED

    state "OPEN, solicitud activa" as OPEN
    state "COMPLETION_PENDING, esperando contraparte" as PENDING
    state "CLOSED, cerrada definitivamente" as CLOSED

    OPEN --> PENDING : COMPLETION_REQUESTED, abre ventana 72 h
    PENDING --> OPEN : COMPLETION_NOT_ACCEPTED, rechazo con cooldown 24 h
    PENDING --> OPEN : COMPLETION_REQUEST_WITHDRAWN, retiro del iniciador
    PENDING --> CLOSED : COMPLETION_CONFIRMED, ambas partes
    PENDING --> CLOSED : COMPLETION_TIMEOUT, vence la ventana
    OPEN --> CLOSED : REQUEST_DECLINED, sin interaccion previa
    OPEN --> CLOSED : cancelacion explicita

    state CLOSED {
        direction TB
        state "BILATERAL, peso 1.0" as B
        state "REQUESTER_CONFIRMED_PROVIDER_NO_RESPONSE, peso 0.5" as RC
        state "PROVIDER_CLAIMED_REQUESTER_NO_RESPONSE, sin resena" as PC
        state "CANCELLED_BY_PROVIDER_AFTER_ENGAGEMENT, peso 0.5" as CAE
        state "CANCELLED_BY_PROVIDER, sin resena" as CP
        state "DECLINED_BY_PROVIDER, sin resena" as DP
    }

    CLOSED --> [*]

    note right of PENDING
        Subestado implicito
        una sola confirmacion mas
        completionDeadline activo
        y completionInitiatorUserId fijado
    end note

    note right of CLOSED
        El eje moderation_state
        CLEAN, FLAGGED, RESTRICTED
        es ortogonal y no bloquea
        ninguna transicion
    end note
</script>

<script type="text/plain" id="src-expiracion">

<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
mermaid.initialize({startOnLoad:false,theme:'base',themeVariables:{primaryColor:'#eef4ff',primaryBorderColor:'#3b6ea8',primaryTextColor:'#12263f',lineColor:'#5b6b80',fontSize:'13px',fontFamily:'Segoe UI, system-ui, sans-serif'},flowchart:{useMaxWidth:false,htmlLabels:true,nodeSpacing:40,rankSpacing:55},state:{useMaxWidth:false}});

const META = {
  ciclo: 'Flujo completo de una solicitud con calles por actor. El punto clave es que el cierre necesita <b>dos confirmaciones</b>: quien pide el cierre abre una ventana de 72 horas y la contraparte puede confirmar, rechazar o dejar vencer. El rechazo reabre la solicitud, pero exige <b>24 horas de espera y al menos un mensaje nuevo</b> para evitar bloqueos en bucle.',
  estados: 'Los tres ejes del modelo. <b>workflow_phase</b> es el unico con ciclo de vida y es reversible; <b>closure_outcome</b> solo se puebla al cerrar y determina si la resena es posible y con que peso; <b>moderation_state</b> es ortogonal. Esta separacion es la que permite responder no solo si termino, sino como termino.',
  expiracion: 'El vencimiento se resuelve por dos caminos que comparten la misma tabla de decision: el cron cada 10 minutos y la resolucion perezosa cuando alguien toca la solicitud. Ambos usan <b>bloqueo optimista por version</b>, asi que si los dos coinciden uno pierde la carrera de forma segura y salta el hilo sin duplicar efectos.',
  resena: 'La elegibilidad se evalua en orden estricto y cada bloqueo devuelve un mensaje entendible en lugar de un error generico. Solo el cierre bilateral da peso <b>1.0</b>; las vias unilaterales validas dan <b>0.5</b> y exigen evidencia real de interaccion comercial.',
  onboarding: 'Alta del negocio. El perfil nace en <b>DRAFT</b> y no es visible hasta cumplir tres requisitos verificables. La IA solo sugiere texto: la persona revisa y aprueba antes de guardar, de modo que no se publica contenido automatico sin control humano.'
};

const stage=document.getElementById('stage'),meta=document.getElementById('meta'),lvl=document.getElementById('lvl');
let current='ciclo',zoom=1;
function applyZoom(){const s=stage.querySelector('svg');if(!s)return;s.style.transformOrigin='0 0';s.style.transform=`scale(${zoom})`;lvl.textContent=Math.round(zoom*100)+'%';}
async function draw(k){current=k;meta.innerHTML=META[k]||'';const code=document.getElementById('src-'+k).textContent.trim();stage.textContent='Renderizandoâ€¦';
 try{const{svg}=await mermaid.render('g-'+k+'-'+Date.now(),code);stage.innerHTML=svg;zoom=1;applyZoom();}
 catch(e){stage.innerHTML='<div class="err">No se pudo renderizar.\n\n'+String(e&&e.message?e.message:e).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'\n\nMermaid se carga desde CDN, revisa la conexion.</div>';}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.d);}));
document.getElementById('in').onclick=()=>{zoom=Math.min(zoom+0.15,3);applyZoom();};
document.getElementById('out').onclick=()=>{zoom=Math.max(zoom-0.15,0.3);applyZoom();};
function svgStr(){const s=stage.querySelector('svg');if(!s)return null;const c=s.cloneNode(true);c.style.transform='';c.setAttribute('xmlns','http://www.w3.org/2000/svg');return new XMLSerializer().serializeToString(c);}
document.getElementById('svg').onclick=()=>{const s=svgStr();if(!s)return;const u=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=u;a.download='tradearc-actividades-'+current+'.svg';a.click();URL.revokeObjectURL(u);};
document.getElementById('png').onclick=()=>{const el=stage.querySelector('svg'),s=svgStr();if(!s||!el)return;const b=el.getBoundingClientRect(),k=2;
 const w=Math.ceil((el.viewBox.baseVal.width||b.width/zoom)*k),h=Math.ceil((el.viewBox.baseVal.height||b.height/zoom)*k);
 const img=document.createElement("img");img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='tradearc-actividades-'+current+'.png';a.click();};
 img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(s)));};
draw('ciclo');
</script>
</body>
</html>

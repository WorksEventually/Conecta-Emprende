name: Publicar diagramación en GitHub Pages

on:
  push:
    branches:
      - test
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/deploy-diagramacion-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar visor de diagramación
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar carpeta docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
